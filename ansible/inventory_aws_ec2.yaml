---
plugin: aws_ec2
regions:
  - eu-west-3
filters:
  tag:Name: web-*
  instance-state-name: running
keyed_groups:
  - key: tags.Name
hostnames:
  - "{{ tags.Name }}-{{ instance_id }}"
compose:
  ansible_host: public_ip_address
  inventory_hostname: "{{ tags.Name }}-{{ instance_id }}"
